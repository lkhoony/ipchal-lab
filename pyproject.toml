[project]
name = "ipchal-lab"
version = "0.1.0"
description = "낙찰가 예측 feature 실험 환경"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightgbm==4.6.0",
  "scikit-learn==1.8.0",
  "pandas==3.0.1",
  "numpy==2.4.3",
  "scipy",
  "joblib",
  "db-dtypes",
  "google-cloud-bigquery",
  "google-cloud-storage",
  "pydata-google-auth",
  "sqlglot",
]

[project.scripts]
ipchal = "ipchal_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipchal_lab"]
